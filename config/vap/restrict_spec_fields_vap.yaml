apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: authorino-restrict-spec-fields
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["operator.authorino.kuadrant.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["authorinos"]
  variables:
    - name: isExemptClusterWide
      expression: "authorizer.requestResource.check('set-cluster-wide').allowed()"
    - name: isExemptImage
      expression: "authorizer.requestResource.check('set-image').allowed()"
    - name: wantsClusterWide
      expression: "has(object.spec.clusterWide) && object.spec.clusterWide"
    - name: wantsImage
      expression: "has(object.spec.image) && object.spec.image != ''"
    # subjects without the permission can still edit unrelated fields of an object that
    # already has it enabled.
    - name: hadClusterWide
      expression: "oldObject != null && has(oldObject.spec.clusterWide) && oldObject.spec.clusterWide"
    # spec.image is a free-form string, so grandfather by exact value: a subject without the
    # permission may keep an already-set image while editing other fields, but may not change it.
    - name: imageUnchanged
      expression: "oldObject != null && (has(oldObject.spec.image) ? oldObject.spec.image : '') == (has(object.spec.image) ? object.spec.image : '')"
  validations:
    - expression: "!variables.wantsImage || variables.imageUnchanged || variables.isExemptImage"
      message: "spec.image can only be set by a subject granted the 'set-image' permission on authorinos"
      reason: Forbidden
    - expression: "!variables.wantsClusterWide || variables.hadClusterWide || variables.isExemptClusterWide"
      message: "spec.clusterWide: true (cluster-wide secret lookup) can only be enabled by a subject granted the 'set-cluster-wide' permission on authorinos"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: authorino-restrict-spec-fields-binding
spec:
  policyName: authorino-restrict-spec-fields
  validationActions: ["Deny"]
